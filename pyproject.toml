[project]
name = "poc-data-seed"
version = "0.1.0"
description = "Minimal agent hello-world starter template"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "agent-engine-runner-shared[mongodb]",
    "agent-engine-sdk-langgraph",
    "grpcio>=1.76.0",
    "grpcio-health-checking>=1.76.0",
    "python-dotenv>=1.0.0",
    "pymongo>=4.6,<5",
    "langchain>=1.0.0",
    "langchain-openai>=1.1.12",
    "langchain-xai>=1.3.0",
    "langchain-google-genai>=2.1.0",
    "langchain-anthropic>=1.4.0",
]

[project.scripts]
poc-data-seed = "agent_poc_data_seed.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_poc_data_seed"]

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
